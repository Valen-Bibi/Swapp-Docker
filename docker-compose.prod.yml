services:
  db:
    image: postgres:15-alpine
    container_name: swapp-db
    restart: always
    env_file:
      - ./swapp-backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./swapp-backend
    container_name: swapp-backend
    volumes:
      - ./swapp-backend/uploads:/app/uploads
    depends_on:
      - db
    env_file:
      - ./swapp-backend/.env
    ports:
      - "7860:7860"
    restart: always

  frontend:
    build:
      context: ./swapp-admin-dashboard
      args:
        NEXT_PUBLIC_API_URL: "https://api.swapp.com.ar"
    container_name: swapp-frontend
    depends_on:
      - backend
    env_file:
      - ./swapp-frontend/.env
    ports:
      - "3000:3000"
    restart: always

  admin:
    build:
      context: ./swapp-admin-dashboard
      args:
        NEXT_PUBLIC_API_URL: "https://api.swapp.com.ar"
    container_name: swapp-admin
    depends_on:
      - backend
    env_file:
      - ./swapp-admin-dashboard/.env
    ports:
      - "3001:3000"
    restart: always

  npm:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
